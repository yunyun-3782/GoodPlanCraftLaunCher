<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPCL - Loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0d0d15 0%, #1a1a2e 50%, #0d0d15 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      padding: 40px;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(79, 195, 247, 0.2), rgba(41, 182, 246, 0.1));
      padding: 12px;
      animation: pulse 2s ease-in-out infinite;
    }

    .logo img {
      width: 100%;
      height: 100%;
      border-radius: 18px;
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 0 30px rgba(79, 195, 247, 0.3);
      }
      50% {
        box-shadow: 0 0 60px rgba(79, 195, 247, 0.5);
      }
    }

    .brand-name {
      font-size: 24px;
      font-weight: 600;
      color: #a0aec0;
      letter-spacing: 2px;
      text-align: center;
    }

    .brand-name .highlight {
      color: #4fc3f7;
      font-weight: 700;
    }

    .version-info {
      font-size: 12px;
      color: #5f6d85;
      margin-top: 10px;
    }

    .powered-by {
      font-size: 10px;
      color: #5f6d85;
      margin-top: 5px;
      text-align: center;
    }

    .powered-by a {
      color: #666;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .powered-by a:hover {
      color: #4fc3f7;
    }

    .copyright {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: #5f6d85;
      text-align: center;
    }

    .particle-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(79, 195, 247, 0.5);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) translateX(20px);
        opacity: 0;
      }
    }

    .fade-out {
      animation: fadeOut 0.5s ease-out forwards;
    }

    @keyframes fadeOut {
      from {
        opacity: 1;
      }
      to {
        opacity: 0;
      }
    }

    body.light-mode {
      background: linear-gradient(135deg, #f0f8ff 0%, #e6f2ff 50%, #f0f8ff 100%);
    }

    body.light-mode .brand-name {
      color: #2d4a6f;
    }

    body.light-mode .brand-name .highlight {
      color: #0099ff;
    }

    body.light-mode .version-info {
      color: #6a8aa6;
    }

    body.light-mode .powered-by {
      color: #8aa0c0;
    }

    body.light-mode .powered-by a {
      color: #666;
    }

    body.light-mode .powered-by a:hover {
      color: #0099ff;
    }

    body.light-mode .logo {
      background: linear-gradient(135deg, rgba(0, 153, 255, 0.15), rgba(0, 119, 204, 0.08));
      animation: pulse-light 2s ease-in-out infinite;
    }

    @keyframes pulse-light {
      0%, 100% {
        box-shadow: 0 0 30px rgba(0, 153, 255, 0.2);
      }
      50% {
        box-shadow: 0 0 60px rgba(0, 153, 255, 0.35);
      }
    }

    body.light-mode .particle {
      background: rgba(0, 153, 255, 0.4);
    }
  </style>
</head>
<body>
  <div class="particle-container" id="particles"></div>

  <div class="splash-container" id="splash-content">
    <div class="logo">
      <img src="logo.png" alt="GPCL Logo">
    </div>
    <div class="brand-name">
      <span class="highlight">G</span>ood <span class="highlight">P</span>lan <span class="highlight">C</span>raft <span class="highlight">L</span>auncher
    </div>
    <div class="version-info" id="version-info">v1.1.0</div>
    <div class="powered-by">
      Powered by <a href="https://www.caellab.com/" target="_blank">虚舟实验室(CaelLab)</a> & You
    </div>
  </div>

  <script>
    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 25; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.bottom = '-10px';
        particle.style.animationDelay = Math.random() * 6 + 's';
        particle.style.animationDuration = (4 + Math.random() * 4) + 's';
        container.appendChild(particle);
      }
    }

    function detectTheme() {
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
        document.body.classList.add('light-mode');
      }
    }

    detectTheme();
    createParticles();

    window.addEventListener('DOMContentLoaded', () => {
      const checkSkipSplash = async () => {
        try {
          if (window.gpcl && window.gpcl.getSettings) {
            const settings = await window.gpcl.getSettings();
            if (settings && settings.appearance && settings.appearance.skipSplash === true) {
              window.location.href = 'index.html';
              return;
            }
          }
        } catch (e) {}

        if (window.gpcl && window.gpcl.getAppVersion) {
          window.gpcl.getAppVersion().then(version => {
            document.getElementById('version-info').textContent = 'v' + version;
          });
        }

        setTimeout(() => {
          const splashContent = document.getElementById('splash-content');
          splashContent.classList.add('fade-out');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 500);
        }, 2000);
      };

      checkSkipSplash();
    });
  </script>
</body>
</html>
